- name: Installer Python3.8 sur CentOS
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Installer python38 via raw
      ansible.builtin.raw: yum install -y python38

    - name: Créer le lien symbolique python3 -> python3.8
      ansible.builtin.raw: alternatives --set python3 /usr/bin/python3.8